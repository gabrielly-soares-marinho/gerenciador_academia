<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Desafios - Olympus</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .desafios-container {

            width: 90%;

            max-width: 1000px;

            margin: 120px auto 50px;

        }


        .desafios-titulo {

            text-align: center;

            color: #ffd700;

            margin-bottom: 10px;

        }


        .desafios-subtitulo {

            text-align: center;

            color: white;

            margin-bottom: 35px;

        }


        #listaDesafios {

            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;

        }


        .desafio-card {

            background:
                rgba(0, 0, 0, 0.85);

            border:
                2px solid #ffd700;

            border-radius: 15px;

            padding: 25px;

            text-align: center;

            color: white;

        }


        .desafio-card h2 {

            color: #ffd700;

            margin-bottom: 15px;

        }


        .desafio-card p {

            margin: 12px 0;

        }


        .desafio-card button {

            margin-top: 15px;

        }


        @media (max-width: 700px) {

            #listaDesafios {

                grid-template-columns: 1fr;

            }

        }

    </style>

</head>


<body>

    <div class="dashboard">


        <header class="topbar">

            <h2>
                🏆 DESAFIOS OLYMPUS
            </h2>


            <div class="user-info">

                <button
                    class="btn-amarelo"
                    onclick="voltarDashboard()">

                    Voltar

                </button>


                <button
                    class="btn-amarelo"
                    onclick="logout()">

                    Sair

                </button>

            </div>

        </header>


        <main
            class="desafios-container"
        >

            <h1
                class="desafios-titulo"
            >

                🏆 DESAFIOS OLYMPUS

            </h1>


            <p
                class="desafios-subtitulo"
            >

                Participe dos desafios
                e acompanhe sua evolução!

            </p>


            <div
                id="listaDesafios"
            >

                <p
                    style="
                        color:white;
                        text-align:center;
                    "
                >

                    Carregando desafios...

                </p>

            </div>

        </main>

    </div>


    <script
        src="js/desafios.js"
    ></script>

</body>

</html>
