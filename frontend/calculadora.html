<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Calculadora - Olympus</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="dashboard">

    <header class="topbar">

        <h2>CALCULADORA IMC / TMB</h2>

        <div class="user-info">

            <button
                class="btn-amarelo"
                onclick="window.location.href='dashboard.html'"
            >
                Voltar
            </button>

        </div>

    </header>


    <main class="avaliacao-container">

        <div class="avaliacao-card">

            <h1>Avaliação Física</h1>

            <p class="avaliacao-subtitulo">

                Informe seus dados para descobrir
                seu IMC, TMB e receber uma
                recomendação de treino.

            </p>


            <!-- PESO -->

            <label for="peso">

                Peso (kg)

            </label>

            <input
                type="number"
                id="peso"
                placeholder="Ex: 70"
                step="0.1"
                min="1"
            >


            <!-- ALTURA -->

            <label for="altura">

                Altura (cm)

            </label>

            <input
                type="number"
                id="altura"
                placeholder="Ex: 175"
                step="0.1"
                min="1"
            >


            <!-- IDADE -->

            <label for="idade">

                Idade

            </label>

            <input
                type="number"
                id="idade"
                placeholder="Ex: 20"
                min="1"
            >


            <!-- GÊNERO -->

            <label for="genero">

                Gênero

            </label>

            <select id="genero">

                <option value="">
                    Selecione
                </option>

                <option value="masculino">
                    Masculino
                </option>

                <option value="feminino">
                    Feminino
                </option>

            </select>


            <!-- BOTÃO -->

            <button
                class="btn-amarelo"
                onclick="calcularIMC()"
            >

                Calcular

            </button>


            <!-- RESULTADO -->

            <div
                id="resultado"
                style="margin-top: 25px;"
            >

            </div>


        </div>

    </main>


    <script src="js/calculadora.js"></script>

</body>

</html>
